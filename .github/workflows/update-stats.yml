name: Update profile statistics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-stats.mjs
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate statistics
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save updated card
        run: |
          git config user.name 'Filip Nowakowicz'
          git config user.email 'filip.nowakowicz@gmail.com'
          git add assets/ README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update profile statistics'
            git push
          fi
